<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXAMPLES</title>
    <link rel="stylesheet" href="../dist/output.css">
</head>
<body>
    <div class="flex justify-center gap-4">
        <button onclick="
            console.log(`Cart Quantity : ${cartQuantity}`);
        " class="px-4 py-2 rounded-lg">Show Quantity</button>
        <button onclick="
            cartQuantity += 1;
            console.log(`Cart Quantity : ${cartQuantity}`);
        " class="px-4 py-2 rounded-lg">Add to Cart</button>
        <button onclick="
            cartQuantity += 2;
            console.log(`Cart Quantity : ${cartQuantity}`);
        " class="px-4 py-2 rounded-lg">+2</button>
        <button onclick="
            cartQuantity += 3;
            console.log(`Cart Quantity : ${cartQuantity}`);
        " class="px-4 py-2 rounded-lg">+3</button>
        <button onclick="
            cartQuantity = 0;
            console.log(`Cart Quantity : ${cartQuantity}`);
        " class="px-4 py-2 rounded-lg">Reset Cart</button>
    </div>


    <script src="/scripts/cart-quantity.js"></script>
    <script src="/scripts/variables.js"></script>
    <script src="/scripts/booleans.js"></script>
</body>
</html>
